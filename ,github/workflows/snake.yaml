name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Build cute snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1a1a1a&color_dots=#fff0f5,#ffe0ec,#ffc8dd,#ffafcc,#ff99c2&color_dot_border=#ffffff00
            dist/github-snake-dark.svg?color_snake=#1a1a1a&color_dots=#3a2a33,#ffe0ec,#ffc8dd,#ffafcc,#ff99c2&color_dot_border=#00000000

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
